name: Log Anomaly Detection CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/anomaly-api:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/anomaly-api:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
              docker pull ${{ secrets.DOCKERHUB_USERNAME }}/anomaly-api:latest

              # remove old named container if it exists
              docker rm -f anomaly-api || true

              # kill anything using port 8000 (important fix)
              docker ps -q --filter "publish=8000" | xargs -r docker stop
              docker ps -aq --filter "publish=8000" | xargs -r docker rm

              # start fresh container
              docker run -d \
                --restart unless-stopped \
                -p 8000:8000 \
                --name anomaly-api \
                ${{ secrets.DOCKERHUB_USERNAME }}/anomaly-api:latest