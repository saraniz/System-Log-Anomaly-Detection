name: Log Anomaly Detection CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/anomaly-api:latest .

      # Push image
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/anomaly-api:latest

      # Deploy to EC2
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Starting deployment..."

            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/anomaly-api:latest

            # Remove old container safely
            docker rm -f anomaly-api || true

            # Free port 8000 if occupied
            docker ps -q --filter "publish=8000" | xargs -r docker stop
            docker ps -aq --filter "publish=8000" | xargs -r docker rm

            # Run new container
            docker run -d \
              --restart unless-stopped \
              -p 8000:8000 \
              --name anomaly-api \
              ${{ secrets.DOCKER_USERNAME }}/anomaly-api:latest

            echo "Deployment complete"